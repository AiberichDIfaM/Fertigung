[project]
name = "fertigung"
version = "0.1.0"
description = "Reinforcement learning control for flexible job-shop manufacturing plants"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=0.29.1,<1.4",
    "networkx>=3.4",
    "pydantic>=2.7",
    "pyyaml>=6",
    "numpy>=1.26,<3",
    "sb3-contrib>=2.6,<3",
    "stable-baselines3>=2.6,<3",
    "torch>=2.6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
fertigung = "fertigung.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fertigung"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
